<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Truck Viewer</title>

  <!-- Babylon -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylon.shadowOnlyMaterial.min.js"></script>

  <!-- Google OAuth -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Shared Babylon core -->
  <script src="js/viewerCore.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      border-radius: 4px;
      z-index: 20;
      opacity: 1;
      transition: opacity .4s ease;
      white-space: pre-line;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #authBtn {
      padding: 20px 28px;
      font-size: 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.92);
      color: #111;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      text-align: center;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    #authBtn:hover {
      background: white;
      transform: scale(1.03);
    }
  </style>
</head>

<body>

  <div id="overlay">
    <button id="authBtn">Load Image</button>
  </div>

  <div id="status">Loading viewer…</div>
  <canvas id="renderCanvas"></canvas>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const statusBox = document.getElementById("status");
    const overlay = document.getElementById("overlay");
    const authBtn = document.getElementById("authBtn");

    let scene = null;
    let screenMat = null;
    let sceneReady = false;
    let authReady = false;

    // ⭐ Extract file ID from ANY Drive link or raw ID
    function extractFileId(input) {
      if (!input) return null;

      // Raw ID (20+ chars)
      if (/^[A-Za-z0-9_-]{20,}$/.test(input)) return input;

      // /d/<ID>/ format
      const match = input.match(/\/d\/([^\/]+)/);
      if (match) return match[1];

      // id=<ID> format
      const params = new URLSearchParams(input);
      if (params.get("id")) return params.get("id");

      return null;
    }

    const params = new URLSearchParams(window.location.search);
    const driveId = extractFileId(params.get("drive"));

    const CLIENT_ID = "371240549849-dt480l9a06os8h421tmiv7ja60a280i1.apps.googleusercontent.com";
    let accessToken = null;
    let tokenClient = null;

    function tryLoadImage() {
      if (sceneReady && authReady && driveId) {
        loadDriveImage(driveId);
      }
    }

    function initGoogleTokenClient() {
      if (tokenClient) return;

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/drive.readonly",
        callback: (tokenResponse) => {
          accessToken = tokenResponse.access_token;
          authReady = true;

          overlay.classList.add("hidden");
          authBtn.style.display = "none";

          tryLoadImage();
        }
      });
    }

    authBtn.addEventListener("click", () => {
      initGoogleTokenClient();
      tokenClient.requestAccessToken();
    });

    async function fetchDriveBlob(fileId) {
      const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&supportsAllDrives=true`;
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${accessToken}` }
      });

      if (!res.ok) {
        statusBox.textContent = "Failed to load image (404 or permissions).";
        return null;
      }

      return await res.blob();
    }

    async function loadDriveImage(fileId) {
      statusBox.textContent = "Loading image…";

      const blob = await fetchDriveBlob(fileId);
      if (!blob) return;

      const url = URL.createObjectURL(blob);

      if (screenMat.emissiveTexture) {
        screenMat.emissiveTexture.dispose();
      }

      const tex = new BABYLON.Texture(url, scene);
      tex.invertY = false;
      tex.hasAlpha = true;

      screenMat.emissiveTexture = tex;
      screenMat.emissiveColor = new BABYLON.Color3(1, 1, 1);

      statusBox.textContent = "Loaded.";
      setTimeout(() => statusBox.style.opacity = 0, 800);
    }

    createTruckViewer(engine, canvas).then(({ scene: s, camera, screenMat: sm }) => {
      scene = s;
      screenMat = sm;

      engine.runRenderLoop(() => scene.render());

      sceneReady = true;
      statusBox.textContent = "Click 'Load Image' to begin.";

      tryLoadImage();
    });
  </script>

</body>
</html>
