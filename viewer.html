<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Truck Viewer</title>

  <!-- Babylon -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylon.shadowOnlyMaterial.min.js"></script>

  <!-- Google OAuth -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Shared Babylon core -->
  <script src="js/viewerCore.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      border-radius: 4px;
      z-index: 20;
      opacity: 1;
      transition: opacity .4s ease;
      white-space: pre-line;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 1;
      transition: opacity 0.3s ease;
    }

    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #authBtn {
      padding: 20px 28px;
      font-size: 24px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.92);
      color: #111;
      font-family: system-ui, sans-serif;
      font-weight: 600;
      text-align: center;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    #authBtn:hover {
      background: white;
      transform: scale(1.03);
    }
  </style>
</head>

<body>
  <div id="overlay">
    <button id="authBtn">Load Image</button>
  </div>

  <div id="status">Loading viewer…</div>
  <canvas id="renderCanvas"></canvas>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const statusBox = document.getElementById("status");
    const overlay = document.getElementById("overlay");
    const authBtn = document.getElementById("authBtn");

    let scene = null;
    let screenMat = null;
    let accessToken = null;
    let tokenClient = null;

    const params = new URLSearchParams(window.location.search);
    const driveInputValue = params.get("drive");

    const CLIENT_ID = "371240549849-dt480l9a06os8h421tmiv7ja60a280i1.apps.googleusercontent.com";

    function getRedirectUri() {
      const redirectUri = new URL(window.location.href);
      redirectUri.hash = "";
      return redirectUri.toString();
    }

    function extractFileId(input) {
      if (!input) return null;
      const trimmed = input.trim();
      if (!trimmed) return null;

      if (/YOUR_FILE_ID_OR_SHARE_LINK/i.test(trimmed)) return null;
      if (/^[A-Za-z0-9_-]+$/.test(trimmed)) return trimmed;

      const directIdMatch = trimmed.match(/[?&](?:id|drive)=([^&]+)/i);
      if (directIdMatch && directIdMatch[1]) return decodeURIComponent(directIdMatch[1]);

      const shareMatch = trimmed.match(/(?:\/d\/|\/file\/d\/)([^/?]+)/i);
      if (shareMatch && shareMatch[1]) return shareMatch[1];

      return trimmed;
    }

    function initGoogleTokenClient() {
      if (tokenClient) return;

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: "https://www.googleapis.com/auth/drive.readonly",
        callback: (tokenResponse) => {
          accessToken = tokenResponse.access_token;
          statusBox.textContent = "Connected to Google Drive…";

          overlay.classList.add("hidden");
          authBtn.style.display = "none";

          if (driveInputValue) {
            loadDriveImage(driveInputValue);
          }
        }
      });
    }

    function redirectToGoogleAuth() {
      const authUrl = new URL("https://accounts.google.com/o/oauth2/v2/auth");
      authUrl.searchParams.set("client_id", CLIENT_ID);
      authUrl.searchParams.set("redirect_uri", getRedirectUri());
      authUrl.searchParams.set("response_type", "token");
      authUrl.searchParams.set("scope", "https://www.googleapis.com/auth/drive.readonly");
      authUrl.searchParams.set("include_granted_scopes", "true");
      authUrl.searchParams.set("state", encodeURIComponent(window.location.href));
      authUrl.searchParams.set("prompt", "select_account");
      window.location.href = authUrl.toString();
    }

    function startViewerFlow() {
      if (driveInputValue) {
        statusBox.textContent = "Drive link detected. Connecting to Google Drive…";
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
          statusBox.textContent = "Google Identity Services not ready. Try reloading.";
          return;
        }

        if (window.location.hash && window.location.hash.includes("access_token")) {
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          accessToken = hashParams.get("access_token");
          statusBox.textContent = "Connected to Google Drive…";
          overlay.classList.add("hidden");
          authBtn.style.display = "none";
          if (driveInputValue) {
            loadDriveImage(driveInputValue);
          }
          return;
        }

        if (window.google && google.accounts && google.accounts.oauth2) {
          initGoogleTokenClient();
          tokenClient.requestAccessToken({ prompt: "select_account" });
        } else {
          redirectToGoogleAuth();
        }
        return;
      }

      statusBox.textContent = "No Drive file supplied. Add ?drive=FILE_ID_OR_SHARE_LINK to the URL.";
    }

    authBtn.addEventListener("click", () => {
      startViewerFlow();
    });

    async function fetchDriveBlob(fileId) {
      const url = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&supportsAllDrives=true&cacheBust=${Date.now()}`;
      const res = await fetch(url, {
        headers: {
          Authorization: `Bearer ${accessToken}`,
          "Cache-Control": "no-cache"
        },
        cache: "no-store"
      });

      if (!res.ok) {
        statusBox.textContent = `Drive request failed (${res.status}). Make sure the file is shared with the signed-in Google account.`;
        return null;
      }

      return await res.blob();
    }

    async function loadDriveImage(input) {
      if (!screenMat || !scene) {
        statusBox.textContent = "Scene not ready yet.";
        return;
      }

      const fileId = extractFileId(input);
      if (!fileId) {
        statusBox.textContent = "Could not parse the Drive link.";
        return;
      }

      statusBox.textContent = "Loading image…";

      const blob = await fetchDriveBlob(fileId);
      if (!blob) return;

      const objectUrl = URL.createObjectURL(blob);

      if (screenMat.emissiveTexture) {
        screenMat.emissiveTexture.dispose();
        screenMat.emissiveTexture = null;
      }

      const tex = new BABYLON.Texture(objectUrl, scene);
      tex.invertY = false;
      tex.hasAlpha = true;

      screenMat.emissiveTexture = tex;
      screenMat.emissiveColor = new BABYLON.Color3(1, 1, 1);

      statusBox.textContent = "Loaded.";
      setTimeout(() => statusBox.style.opacity = 0, 800);
    }

    createTruckViewer(engine, canvas).then(({ scene: s, screenMat: sm }) => {
      scene = s;
      screenMat = sm;

      engine.runRenderLoop(() => scene.render());
      startViewerFlow();
    });
  </script>
</body>

</html>
